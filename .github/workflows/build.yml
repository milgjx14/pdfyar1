name: Build PDFYar Universal APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project zip
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            ZIP_FILE=$(ls *.zip 2>/dev/null | head -n 1 || true)
            if [ -n "$ZIP_FILE" ]; then
              unzip -o "$ZIP_FILE" || true
            fi
            FOUND=$(find . -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "settings.gradle.kts not found!"
              exit 1
            fi
            PROJ_DIR=$(dirname "$FOUND")
            if [ "$PROJ_DIR" != "." ]; then
              cp -rf "$PROJ_DIR"/app ./
              cp -f "$PROJ_DIR"/settings.gradle.kts "$PROJ_DIR"/build.gradle.kts "$PROJ_DIR"/gradle.properties ./
            fi
          fi

      - name: Download Offline PDF Libraries & Font
        run: |
          mkdir -p app/src/main/assets/libs
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js -o app/src/main/assets/libs/pdf-lib.min.js
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js -o app/src/main/assets/libs/pdf.min.js
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js -o app/src/main/assets/libs/pdf.worker.min.js
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js -o app/src/main/assets/libs/jszip.min.js
          curl -fL --retry 3 "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/webfonts/Vazirmatn%5Bwght%5D.woff2" -o app/src/main/assets/libs/Vazirmatn.woff2 || true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Universal APK
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDFYar-Universal-APK
          path: app/build/outputs/apk/release/app-release.apk
